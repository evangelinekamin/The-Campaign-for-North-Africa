[pytest]
# Parallel test execution across all cores (pytest-xdist). The 440-test suite runs
# many full-campaign simulations (each folding thousands of events; the rule-48 turn
# clock tripled every game's op-stages), so -n auto cuts wall-clock ~3.6x: ~100s vs
# ~360s single-threaded. Requires pytest-xdist (see requirements-dev.txt).
addopts = -n auto
# COLLECT ONLY FROM tests/. Without this a bare `pytest` collects from rootdir, which sweeps up
# any copy of the test tree left under scratchpad/ -- and `tests/` has no __init__.py, so the
# basenames collide and pytest resolves the import to whichever copy it reached first. That has
# now bitten twice: once as 8 spurious collection errors from safety-copied files, and once far
# worse, when a full repo snapshot under scratchpad/ WON the race and a green "1553 passed" was
# measured against the snapshot instead of the working tree. Scoping collection makes a bare run
# mean what it says.
testpaths = tests
